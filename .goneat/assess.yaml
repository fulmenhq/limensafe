version: 1
lint:
  yamllint:
    enabled: true
    strict: true
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
    ignore: []
  shell:
    shfmt:
      enabled: true
      fix: false
      args:
        - "-i"
        - "4"
        - "-ci"
        - "-sr"
    shellcheck:
      enabled: false
      path: ""
    paths:
      - "**/*.sh"
      - "scripts/**/*.sh"
      - ".goneat/hooks/*"
    ignore: []
  github_actions:
    actionlint:
      enabled: true
      paths:
        - ".github/workflows/**/*.yml"
        - ".github/workflows/**/*.yaml"
      ignore: []
  make:
    checkmake:
      enabled: true
    paths:
      - "**/Makefile"
    ignore: []
format:
  eof:
    enabled: true
    enforce_single_newline: true
  trailing_whitespace:
    enabled: true
  markdown:
    enabled: true
    paths:
      - "**/*.md"
    ignore:
      - ".plans/**"
      - ".cache/**"
      - ".git/**"
      - "bin/**"
      - "dist/**"
      - "sbom/**"
      - "**/vendor/**"
      - "**/node_modules/**"
      - "testdata/builtin-baseline/**"
      - "testdata/synthetic-acme/repo/**"
  json:
    enabled: true
    paths:
      - "**/*.json"
    ignore:
      - ".plans/**"
      - ".cache/**"
      - ".git/**"
      - "bin/**"
      - "dist/**"
      - "sbom/**"
      - "**/vendor/**"
      - "**/node_modules/**"
      - "testdata/builtin-baseline/**"
      - "testdata/synthetic-acme/repo/**"
  yaml:
    enabled: true
    paths:
      - "**/*.yaml"
      - "**/*.yml"
    ignore:
      - ".plans/**"
      - ".cache/**"
      - ".git/**"
      - "bin/**"
      - "dist/**"
      - "sbom/**"
      - "**/vendor/**"
      - "**/node_modules/**"
      - "testdata/builtin-baseline/**"
      - "testdata/synthetic-acme/repo/**"
