# yamllint disable rule:document-start
# yamllint disable rule:truthy
#
# Release pipeline for limensafe.
#
# Tag-triggered (v*). Single-job cross-compile that produces a 6-platform
# release build (linux amd64/arm64, darwin amd64/arm64, windows amd64/arm64)
# inside goneat-tools-runner, generates checksum manifests, and publishes
# a DRAFT GitHub Release. Not a GitHub matrix strategy — `make release-build`
# cross-compiles all platforms in one container.
#
# Signing is performed MANUALLY post-build per fulmenhq convention.
# Signing keys are provisioned at the fulmenhq-org level (`fulmenhq-release-*`)
# and shared across fulmenhq workhorses (goneat, a sibling repo, limensafe, …) —
# blast radius limited to one org. The manual signing flow is documented in
# this repository's RELEASE_CHECKLIST.md.
#
# Flow for v0.0.3 and beyond (until/unless CI signing is wired):
#
#   make release-download LIMENSAFE_RELEASE_TAG=v<version>  (or skip if locally built)
#   make release-checksums                       (re-generate manifests)
#   make release-verify-checksums
#   make release-sign LIMENSAFE_RELEASE_TAG=v<version>     (minisign only)
#   make release-export-keys
#   make release-sign-pgp                       (optional; separate authorization)
#   make release-verify-keys
#   make release-verify-signatures
#   make release-notes LIMENSAFE_RELEASE_TAG=v<version>
#   make release-verify-inventory
#   make release-upload LIMENSAFE_RELEASE_TAG=v<version>
#
# After signing + upload of provenance assets, manually flip the draft to
# published in the GitHub UI after separate authorization. See this repo's
# RELEASE_CHECKLIST.md for defined environment variables, committed pin
# references and verification commands. Key provisioning stays out of tree.
#
# Future CI-signing enhancement (not blocked — optional automation):
# If CI-side signing is desired, provision the minisign secret-key contents
# (and optionally the PGP private-key ASCII-armored blob for keyring import)
# as GitHub Actions secrets at the org/repo level, then insert the
# `make release-sign release-export-keys release-verify-keys
# release-verify-signatures` chain between the build and upload steps below.
# A GPG_HOMEDIR secret path alone is insufficient — the keyring must be
# imported into a fresh homedir on the runner during the job.
name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  verify-signature:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged-commit public pin and authorized signer
        env:
          LIMENSAFE_RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-pin.py verify
      - name: Require additional GitHub signature verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          object=$(git rev-parse "refs/tags/$GITHUB_REF_NAME")
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq '.verification.verified')" = true
  release:
    needs: verify-signature
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner:v0.5.7
      options: --user 1001
    env:
      FULMEN_WORKSPACE_ROOT: ${{ github.workspace }}
      CGO_ENABLED: "0"
      GOPATH: ${{ github.workspace }}/../_go
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare Go directories
        run: mkdir -p "$GOPATH/bin" "$GOPATH/pkg"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Validate VERSION matches tag
        shell: bash
        run: |
          set -euo pipefail
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION file: $FILE_VERSION"
          echo "Git tag: $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            MSG="VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"
            echo "::error::$MSG"
            exit 1
          fi
      - name: Verify version alignment (VERSION ↔ .fulmen/app.yaml ↔ embedded)
        shell: bash
        run: |
          set -euo pipefail
          make verify-version-alignment
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          goneat --version
          sfetch --version
          go version
          go mod download
      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          make lint
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          make test
      - name: Bootstrap smoke (end-to-end CLI proof before release-build)
        shell: bash
        run: |
          set -euo pipefail
          make bootstrap-smoke
      - name: Build release artifacts (6 platforms)
        shell: bash
        run: |
          set -euo pipefail
          make release-build
      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          make release-verify-checksums
          make release-verify-build-inventory
      - name: Publish GitHub Release (draft — signing happens locally before flip)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*
